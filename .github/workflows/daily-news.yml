name: 每日新聞更新

on:
  workflow_dispatch:
  schedule:
    # GitHub 使用 UTC；21:00 等於台灣隔日早上 05:00。
    - cron: '0 21 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-news-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得網站程式
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 準備 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝新聞處理套件
        run: python -m pip install -r requirements.txt

      - name: 設定網站發布
        uses: actions/configure-pages@v5

      - name: 蒐集新聞與產生繁體中文摘要
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: python collect_news.py

      - name: 儲存本期新聞
        run: |
          git add news.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '更新每日新聞 [skip ci]'
            git push origin HEAD:main
          fi

      - name: 準備公開網站檔案
        run: |
          mkdir -p .site
          cp index.html news.json .site/

      - name: 上傳網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 顯示來源檢查結果
        if: always()
        run: |
          if [ -f .build/source-report.json ]; then
            cat .build/source-report.json
          fi
